<!-- Mark the sitemap link for this page; a bare /spec/ is index.html. -->
<script>
  (function () {
    var page = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.sitemap a').forEach(function (a) {
      if (a.getAttribute('href') === page) a.setAttribute('aria-current', 'page');
    });
  })();
</script>
<!-- Mermaid support for [source,mermaid] code blocks. Asciidoctor has no
     native Mermaid renderer, so this is client-side: turn the generated
     `code.language-mermaid` block into what Mermaid expects and let its
     browser build render it on load. -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  document.querySelectorAll('pre.highlight code.language-mermaid').forEach(function (code) {
    var div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = code.textContent;
    code.closest('pre').replaceWith(div);
  });
  // 'base' is the only Mermaid theme that honours themeVariables; these match
  // public/spec/spec-theme.css instead of Mermaid's default lavender.
  mermaid.initialize({
    startOnLoad: true,
    theme: 'base',
    themeVariables: {
      primaryColor: '#fbeaea',
      primaryBorderColor: '#d32f2f',
      primaryTextColor: '#1a1a1a',
      lineColor: '#666',
      edgeLabelBackground: '#f2f2f2',
      clusterBkg: '#fafafa',
      clusterBorder: '#d9d9d9',
      fontFamily: 'system-ui, sans-serif'
    }
  });
</script>
<!-- Mark the ToC link for the current #hash. CSS can match the target heading
     (:target) but not the link pointing at it, so this bridges the two. -->
<script>
  function markCurrentTocLink() {
    document.querySelectorAll('#toc a').forEach(function (a) {
      if (location.hash && a.hash === location.hash) {
        a.setAttribute('aria-current', 'location');
        // Long L3 ToCs overflow the fixed sidebar; keep the entry in view.
        a.scrollIntoView({ block: 'nearest' });
      } else {
        a.removeAttribute('aria-current');
      }
    });
  }
  markCurrentTocLink();
  window.addEventListener('hashchange', markCurrentTocLink);
</script>
<!-- Tag the `_Key:_` labels (Satisfies, Rationale, ...) that open each line of
     a requirement so spec-theme.css can set them apart from the body text.
     CSS alone can't: it can't see the trailing colon, and `em:first-child`
     ignores text nodes, so it would also catch italic words and notes. -->
<script>
  document.querySelectorAll('.paragraph > p > em').forEach(function (em) {
    if (!/:\s*$/.test(em.textContent)) return;
    var prev = em.previousSibling;
    while (prev && prev.nodeType === Node.TEXT_NODE && !prev.textContent.trim()) prev = prev.previousSibling;
    if (!prev || prev.nodeName === 'BR') em.classList.add('meta-key');
  });
</script>
